[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "autoqa-hybrid"
version = "0.1.0"
description = "AutoQA Agent: Python control layer + Rust native vision/DOM engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "playwright>=1.44.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "maturin>=1.7,<2"]

[tool.maturin]
python-source = "python"
# Extension built as autoqa._native (autoqa is the high-level Python package).
module-name = "autoqa._native"
features = ["extension-module"]
